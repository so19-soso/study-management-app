<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f5fa;--cd:#fff;--tx:#17233b;--mu:#6b778c;--ac:#2b59d6;--at:#fff;--bd:#dde3ee;--wa:#d9473f}
[data-t=dark]{--bg:#10131a;--cd:#1a1f2a;--tx:#e8ecf4;--mu:#8e99ad;--ac:#7fb0ff;--at:#0b1220;--bd:#2a3140;--wa:#ff7a70}
[data-t=pastel]{--bg:#fdf0f4;--cd:#fff;--tx:#4a3340;--mu:#a08793;--ac:#e07aa0;--at:#fff;--bd:#f3d9e2}
[data-t=mint]{--bg:#edf8f3;--cd:#fff;--tx:#1f3a30;--mu:#6f9285;--ac:#3fa585;--at:#fff;--bd:#d2eadf}
body{font:400 1rem/1.5 "Zen Maru Gothic",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 0}
#app{max-width:560px;margin:auto;padding:14px 14px 96px}
h2{font-size:1.4rem;font-weight:900;margin:4px 0 12px}h3{font-size:1rem;margin:14px 0 8px}
small,.mu{color:var(--mu);font-size:.8rem}b{font-weight:700}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.fl{flex:1;min-width:0}.w{width:100%;margin-bottom:10px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:10px 16px;cursor:pointer}
.pri{background:var(--ac);color:var(--at);border-color:var(--ac)}.btn.w{display:block}
.ic{font:inherit;font-size:1.3rem;border:0;background:none;color:var(--tx);padding:4px 10px;cursor:pointer}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--at);border-color:var(--ac)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;margin:4px 0 10px}
input[type=radio],input[type=checkbox]{width:auto;margin:0 10px 0 0}input[type=range]{-webkit-appearance:none;appearance:none;height:24px;padding:0;border:0;background:transparent;margin:4px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--bd);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ac);margin-top:-9px;border:0}
input[type=range]::-moz-range-track{height:6px;background:var(--bd);border-radius:3px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ac);border:0}
.tk{position:relative;height:30px;margin-bottom:6px}.tk i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:.65rem;color:var(--mu);white-space:nowrap;text-align:center}
.tk i::before{content:"";display:block;width:1px;height:6px;background:var(--mu);margin:0 auto 2px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.it:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ac)}
.tag{font-size:.7rem;border-radius:6px;padding:1px 7px;border:1px solid var(--ac);color:var(--ac)}.tag.m{background:var(--ac);color:var(--at)}.tag.r{border-color:var(--wa);color:var(--wa)}
.cd{text-align:center;padding:18px 0 14px}.cd b{display:block;font-size:4.2rem;line-height:1;font-weight:900;color:var(--ac)}
.big{font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0;text-align:center}.g2 b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin:6px 0 12px}
.cal button{font:inherit;font-size:.85rem;border:0;border-radius:10px;background:var(--cd);color:var(--tx);height:38px;position:relative}
.cal .sel{background:var(--ac);color:var(--at)}.cal .tdy{outline:1.5px solid var(--ac)}.cal .dt::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--wa)}
.cal .du::before{content:"";position:absolute;top:4px;right:5px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid var(--wa)}.cal .out{opacity:.35}.mb{display:none}
.ch{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:10px}.ch>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.ch i{width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.hm button{height:46px;padding:0;overflow:hidden}.hm i{position:absolute;inset:0;background:var(--ac)}.hm button span{position:relative;display:block;font-size:.8rem;line-height:1.15}
.hm button small{font-size:.6rem}.hm .hi,.hm .hi small{color:var(--at)}.hm .ms small{color:var(--wa);font-weight:700}.hm .hs{outline:2px solid var(--tx)}
#nv{position:fixed;bottom:0;left:0;right:0;display:none;grid-template-columns:repeat(5,1fr);background:var(--cd);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
#nv button{font:inherit;font-size:.7rem;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .18s}#nv button.on{color:var(--ac);font-weight:900;transform:translateY(-6px) scale(1.28)}#nv i{font-style:normal;font-size:1.25rem;line-height:1}
#nv .go{background:var(--ac);color:var(--at);width:56px;height:56px;border-radius:50%;margin:-24px auto 0;justify-content:center;font-size:1.4rem}
.ctl{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
#live{text-align:center;padding:10px 0}#live .now{font-weight:700;margin:6px 0}#live .subs{margin:16px auto;max-width:340px;text-align:left}
#live .subs div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}#md.on{display:flex}
.sh{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#bo{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:15}#bo.on{display:flex}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:999px;display:none;z-index:30;font-size:.85rem}
.lg{margin-top:12vh}.lg h2{font-size:2rem}
</style></head>
<body><div id="app">読み込み中…</div>
<nav id="nv">
<button data-a="nav" data-v="home"><i>🏠</i><span>ホーム</span></button>
<button data-a="nav" data-v="today"><i>📅</i><span>今日</span></button>
<button class="go" data-a="nav" data-v="timer">▶</button>
<button data-a="nav" data-v="list"><i>📝</i><span>全体</span></button>
<button data-a="nav" data-v="stats"><i>📊</i><span>記録</span></button>
</nav>
<div id="bo"></div><div id="md"></div><div id="ts"></div>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,td=()=>dstr(new Date());
const fmt=s=>{s=Math.floor(s);return`${pad(s/3600|0)}:${pad(s%3600/60|0)}:${pad(s%60)}`},hm=s=>`${s/3600|0}時間${Math.round(s%3600/60)}分`;
const addD=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return dstr(d)},dd=(a,b)=>Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);
const jd=s=>new Date(s+"T00:00").toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
const uid=()=>Math.random().toString(36).slice(2,9),COL=["#2b59d6","#e0617a","#2e9d6b","#e0a030","#8a5cd6","#17a2b8","#d9473f","#6b778c"];
const D0=()=>({subjects:[],folders:[],cur:"all",todos:[],plan:{},logs:[],results:[],set:{theme:"light",goal:120,fs:16,vib:1,pomo:0,brk:5,all:0}});
let S=D0(),U={uid:"local"},view="home",selDate=td(),cm=td().slice(0,7),fs="",T=null,ac,wl,sv;
const gt=i=>S.todos.find(t=>t.id===i),sj=i=>S.subjects.find(x=>x.id===i)||{name:"未設定",color:"#999"};
const inF=f=>S.cur==="all"||f===S.cur,fo=i=>S.folders.find(x=>x.id===i);
const secOn=(d,s,g)=>S.logs.filter(l=>l.d===d&&(!s||l.s===s)&&(g||inF(l.f))).reduce((a,l)=>a+l.sec,0);
const inRange=(f,d)=>{const x=fo(f);return!x||((!x.start||d>=x.start)&&(!x.end||d<=x.end))};
const rEnd=t=>t.due||fo(t.f)?.end||null;
const actRep=(t,d)=>t.rep&&(!t.rs||d>=t.rs)&&(!rEnd(t)||d<=rEnd(t))&&inRange(t.f,d);
const dayIds=d=>[...new Set([...(S.plan[d]||[]).filter(i=>gt(i)),...S.todos.filter(t=>actRep(t,d)).map(t=>t.id)])];
const sk=(t,d)=>t.rep?d:"_",gs=(t,d)=>(t.sx||{})[sk(t,d)]||{};
const pc=(t,x)=>{const c=v=>Math.max(0,Math.min(100,Math.round(v)));
if(t.m==="cnt")return t.n?c((x.dn||0)/t.n*100):0;
if(t.m==="rng"){const w=t.b-t.a+1;return w>0?c(((x.pg??t.a-1)-t.a+1)/w*100):0}
if(t.m==="chk"){const l=t.it||[];return l.length?c((x.ck||[]).filter(Boolean).length/l.length*100):0}
return x.p??(t.rep?0:t.p||0)};
const pOf=(t,d=td())=>pc(t,gs(t,d));
const setSt=(t,d,o)=>{t.sx=t.sx||{};t.sx[sk(t,d)]={...gs(t,d),...o}};
const full=t=>t.m==="cnt"?{dn:t.n}:t.m==="rng"?{pg:t.b}:t.m==="chk"?{ck:(t.it||[]).map(()=>true)}:{p:100};
const zero=t=>({p:0,dn:0,pg:(t.a||1)-1,ck:[]});
const tks=(mn,mx)=>{const r=mx-mn,k=r<=10?r:[10,8,6,5,4].find(k=>r%k===0)||10;if(k<1)return"";let h="";for(let i=0;i<=k;i++)h+=`<i style="left:calc(12px + (100% - 24px) * ${i/k})">${mn+Math.round(r*i/k)}</i>`;return`<div class="tk">${h}</div>`};
const slT=(t,v)=>t.m==="cnt"?`${v} / ${t.n}${esc(t.u||"")}`:t.m==="rng"?(v<t.a?"未着手":`p.${v} まで`):`${v}%`;
const pEd=(t,x)=>{const c=(v,a,b)=>Math.max(a,Math.min(b,v));
if(t.m==="chk")return`<label>終わった項目</label>${(t.it||[]).map((v,i)=>`<label class="row" style="padding:5px 0"><input type="checkbox" class="ck" ${(x.ck||[])[i]?"checked":""}>${esc(v)}</label>`).join("")}<br>`;
let mn=0,mx=100,st=5,v=pc(t,x),lb="進行度",bt="";
if(t.m==="cnt"){mx=t.n;st=1;v=c(x.dn||0,0,t.n);lb="やった数";bt=`<button class="chip" data-a="stp" data-n="-1">−1</button><button class="chip" data-a="stp" data-n="1">＋1</button><button class="chip" data-a="stp" data-n="5">＋5</button>`}
else if(t.m==="rng"){mn=t.a-1;mx=t.b;st=1;v=c(x.pg??mn,mn,mx);lb=`どこまで終わった？（p.${t.a}〜${t.b}）`;bt=`<button class="chip" data-a="stp" data-n="-1">−1</button><button class="chip" data-a="stp" data-n="1">＋1</button>`}
return`<div class="row sp"><label>${lb}</label>${bt?`<span class="row" style="gap:6px">${bt}</span>`:""}</div><div style="text-align:center;margin:4px 0"><b id="pv" style="font-size:1.3rem">${slT(t,v)}</b></div><input id="pg" type="range" min="${mn}" max="${mx}" step="${st}" value="${v}">${tks(mn,mx)}`};
const pRd=t=>t.m==="chk"?{ck:[...document.querySelectorAll("#md .ck")].map(c=>c.checked)}:t.m==="cnt"?{dn:+val("pg")}:t.m==="rng"?{pg:+val("pg")}:{p:+val("pg")};
const showM=()=>document.querySelectorAll("#md .mb").forEach(b=>b.style.display=b.dataset.m===val("pm")?"block":"none");
const lim=()=>{const f=fo($("#tf")?.value),d=$("#td"),r=$("#rs");d.max=f?.end||"";r.min=f?.start||"";r.max=d.value||f?.end||""};
const streak=()=>{let c=0,d=td();if(!secOn(d,0,1))d=addD(d,-1);while(secOn(d,0,1)>0){c++;d=addD(d,-1)}return c};
const sT=()=>T?localStorage.setItem("sn_t",JSON.stringify(T)):localStorage.removeItem("sn_t");
const el=()=>T?T.acc+(T.st==="run"?(Date.now()-T.t0)/1e3:0):0,sg=()=>T?T.seg+(T.st==="run"?(Date.now()-T.t0)/1e3:0):0;
const bank=()=>{if(T){T.acc=el();T.seg=sg();T.t0=Date.now()}};
const M=h=>{$("#md").innerHTML=`<div class="sh">${h}</div>`;$("#md").classList.add("on")},X=()=>$("#md").classList.remove("on");
const toast=t=>{const e=$("#ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)};
const sel=(id,o,v)=>`<select id="${id}">${o.map(([a,b])=>`<option value="${a}" ${a==v?"selected":""}>${esc(b)}</option>`).join("")}</select>`;
const val=i=>$("#"+i).value;
function save(){try{localStorage.setItem("sn_data",JSON.stringify(S))}catch{toast("保存できませんでした（容量不足の可能性）")}}
function beep(){try{ac=ac||new AudioContext();[0,.4,.8].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.frequency.value=880;g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.3)})}catch{}S.set.vib&&navigator.vibrate?.([300,150,300])}

function nextExam(){let b=null;S.folders.filter(f=>!f.arch&&inF(f.id)).forEach(f=>{let n=null,l="";if(f.start&&f.start>=td()){n=dd(f.start,td());l=`${f.name} 開始まで`}else if(f.start&&f.end&&f.start<td()&&f.end>=td()){n=dd(f.end,td());l=`${f.name} 最終日まで`}if(n!==null&&(!b||n<b.n))b={n,l}});return b}
function overdue(){const t=td(),cur=dayIds(t),o=new Set();Object.keys(S.plan).filter(d=>d<t).forEach(d=>S.plan[d].forEach(i=>{const x=gt(i);if(x&&!x.rep&&inF(x.f)&&pOf(x)<100&&!cur.includes(i)&&inRange(x.f,t))o.add(i)}));return[...o]}
const row=t=>{const p=pOf(t);return`<div class="it" data-a="tedit" data-i="${t.id}"><span class="dot" style="background:${sj(t.s).color}"></span><div class="fl"><b>${esc(t.title)}</b> ${t.must?'<span class="tag m">必須</span>':'<span class="tag">任意</span>'}${t.rep?' <span class="tag">毎日</span>':""}${t.due?` <span class="tag ${!t.rep&&t.due<td()&&p<100?"r":""}">〆${t.due.slice(5)}</span>`:""}${S.cur==="all"&&!nf&&fo(t.f)?` <small>${esc(fo(t.f).name)}</small>`:""}<div class="bar"><i style="width:${p}%"></i></div></div><small>${t.rep?"今日 ":""}${p}%</small></div>`};
let sid="",sback="home",nf=0,hid=[],sm=td().slice(0,7),hs="";
const fkey=r=>r.f||"_";
const exOrd=R=>{const ix=g=>S.folders.findIndex(x=>x.id===g),kd=g=>fo(g)?.start||fo(g)?.end||"9";return[...new Set(R.map(fkey))].sort((a,b)=>kd(a)<kd(b)?-1:kd(a)>kd(b)?1:ix(a)-ix(b))};
const rchart=R=>{const fk=fkey,fl=exOrd(R);
if(fl.length<2)return`<p class="mu">${S.cur!=="all"?"「📚 全て」表示に切り替えると、考査ごとの推移グラフが見られます":"考査の結果が2回分たまると、推移グラフが出ます"}</p>`;
const ss=S.subjects.filter(s=>R.some(r=>r.s===s.id));if(!ss.length)return"";
const W=340,H=215,L=30,RR=14,TP=14,B=46,pw=W-L-RR,ph=H-TP-B,ym=Math.max(100,Math.ceil(Math.max(...R.map(r=>r.sc))/10)*10);
const X=i=>L+pw*i/(fl.length-1),Y=v=>TP+ph*(1-v/ym),sc=(g,s)=>{const r=R.filter(x=>fk(x)===g&&x.s===s);return r.length?r[r.length-1].sc:null};
const ls=ss.map(s=>({id:s.id,c:s.color,n:s.name,p:fl.map((g,i)=>{const v=sc(g,s.id);return v==null?null:[X(i),Y(v),v]}).filter(Boolean)}));
const av={id:"avg",c:"var(--tx)",n:"平均",p:fl.map((g,i)=>{const v=ss.map(s=>sc(g,s.id)).filter(v=>v!=null);if(!v.length)return null;const m=v.reduce((a,b)=>a+b,0)/v.length;return[X(i),Y(m),Math.round(m*10)/10]}).filter(Boolean)};
const tgp=ss.map(s=>({id:s.id,c:s.color,p:fl.map((g,i)=>{const r=R.filter(x=>fk(x)===g&&x.s===s.id).at(-1);return r&&r.tg?[X(i),Y(r.tg)]:null}).filter(Boolean)})),hasTg=tgp.some(l=>l.p.length);
const dtg=l=>hid.includes("tg")||hid.includes(l.id)||!l.p.length?"":`<polyline fill="none" style="stroke:${l.c}" stroke-width="1.3" stroke-dasharray="2 3" points="${l.p.map(p=>p[0]+","+p[1]).join(" ")}"/>${l.p.map(p=>`<rect x="${p[0]-3}" y="${p[1]-3}" width="6" height="6" transform="rotate(45 ${p[0]} ${p[1]})" stroke-width="1.5" style="fill:var(--cd);stroke:${l.c}"/>`).join("")}`;
const all=[...ls,av],grid=[0,.25,.5,.75,1].map(f=>{const y=Y(ym*f);return`<line x1="${L}" x2="${W-RR}" y1="${y}" y2="${y}" style="stroke:var(--bd)"/><text x="${L-4}" y="${y+3}" text-anchor="end" font-size="9" style="fill:var(--mu)">${Math.round(ym*f)}</text>`}).join("");
const xl=fl.map((g,i)=>{const n=fo(g)?.name||"未分類";return`<text x="${X(i)}" y="${H-B+14}" text-anchor="middle" font-size="9" style="fill:var(--mu)"><tspan x="${X(i)}">${esc(n.slice(0,5))}</tspan>${n.length>5?`<tspan x="${X(i)}" dy="11">${esc(n.slice(5,10))}</tspan>`:""}</text>`}).join("");
const dr=l=>hid.includes(l.id)||!l.p.length?"":`<polyline fill="none" style="stroke:${l.c}" stroke-width="${l.id==="avg"?2.5:1.8}" ${l.id==="avg"?'stroke-dasharray="5 3"':""} points="${l.p.map(p=>p[0]+","+p[1]).join(" ")}"/>${l.p.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" style="fill:${l.c}"/>${l.id==="avg"?`<text x="${p[0]}" y="${p[1]-7}" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--tx)">${p[2]}</text>`:""}`).join("")}`;

function init(){
let raw=localStorage.getItem("sn_data");
if(!raw){/* 旧バージョン（ログイン版）の端末内データを引き継ぐ */let best=null;Object.keys(localStorage).filter(k=>k.startsWith("sn_")&&k!=="sn_t"&&k!=="sn_data").forEach(k=>{const v=localStorage.getItem(k);if(!best||v.length>best.length)best=v});raw=best}
try{S={...D0(),...JSON.parse(raw||"null")}}catch{S=D0()}
S.set={...D0().set,...S.set};
if(S.cur!=="all"&&!S.folders.some(f=>f.id===S.cur))S.cur="all";S.logs.forEach(l=>{if(l.f===undefined)l.f=gt(l.t)?.f??null});
try{const t=JSON.parse(localStorage.getItem("sn_t")||"null");if(t){T=t;T.u=U.uid;if(T.st==="run")T.t0=T.t0||Date.now()}}catch{}
view=T?"timer":"home";save();render();
navigator.storage?.persist?.().catch(()=>{})}
setInterval(()=>{if(!U)return;if(T){if(T.st==="brk"&&Date.now()>=T.bend){T.st="pause";T.t0=Date.now();sT();beep();return render()}
if(T.st==="run"&&S.set.pomo&&sg()>=1500){bank();T.seg=0;T.st="brk";T.bend=Date.now()+S.set.brk*6e4;sT();beep();return render()}}
if(view==="timer"||(T&&T.st==="brk"))live()},500);
init();
